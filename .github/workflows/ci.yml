name: proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run deterministic invariants and red-team suite
        run: npm run test:all
      - name: Rebuild judge data and challenge evidence
        run: npm run build:web
