name: proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run deterministic invariants and red-team suite
        run: npm run test:all
      - name: Verify portable Agent OS skill and MCP composition packaging
        run: |
          test -f skills/valid-until/SKILL.md
          grep -q '^name: valid-until$' skills/valid-until/SKILL.md
          grep -q 'Reasoning is not authorization' skills/valid-until/SKILL.md
          test -f AGENTS.md
          grep -q 'NO LONGER VALID' AGENTS.md
          test -f config/mcp-composition.example.json
          grep -q 'https://agent.binance.com/mcp/agentic' config/mcp-composition.example.json
          grep -q 'src/mcp-server.mjs' config/mcp-composition.example.json
          test -f src/binance-mcp-observation.mjs
      - name: Rebuild judge data and challenge evidence
        run: npm run build:web
      - name: Verify Live Proof Lab routes and server-only secret boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/lab.html
          test -f web/live-proof.html
          test -f web/evaluations.html
          test -f api/live-market.mjs
          test -f api/order-status.mjs
          grep -q 'href="/lab"' web/index.html
          grep -q 'href="/live-proof"' web/index.html
          grep -q 'href="/evaluations"' web/index.html
          grep -q 'LIVE · public Spot Testnet observation' web/lab.html
          grep -q 'VERIFIED EXECUTION' web/lab.html
          grep -q 'LIVE SIGNED READ' web/live-proof.html
          if grep -R -n -E 'NEXT_PUBLIC_BINANCE|VITE_BINANCE' web api src functions; then
            echo '::error::Public-prefixed Binance secret reference found'
            exit 1
          fi
          if grep -R -n 'BINANCE_TESTNET_API_SECRET' web; then
            echo '::error::Server secret name referenced by browser surface'
            exit 1
          fi
          if grep -q "method: 'POST'" api/order-status.mjs; then
            echo '::error::Vercel signed known-order refresh must remain read-only'
            exit 1
          fi
          grep -q "req.method !== 'GET'" api/order-status.mjs
          grep -q "https://testnet.binance.vision" api/order-status.mjs
          echo 'LIVE_PROOF_LAB_SECURITY_BOUNDARY=PASS'
      - name: Verify Cloudflare Pages fallback boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f functions/api/live-market.js
          test -f functions/api/order-status.js
          test -f web/_routes.json
          test -f docs/CLOUDFLARE-PAGES-FALLBACK.md
          grep -q 'context.env' functions/api/order-status.js
          grep -q 'https://testnet.binance.vision' functions/api/order-status.js
          grep -q 'https://testnet.binance.vision' functions/api/live-market.js
          grep -q '"/api/\*"' web/_routes.json
          if grep -q "method: 'POST'" functions/api/order-status.js; then
            echo '::error::Cloudflare signed known-order refresh must remain read-only'
            exit 1
          fi
          if grep -R -n 'process.env' functions; then
            echo '::error::Cloudflare Pages Functions must use context.env'
            exit 1
          fi
          echo 'CLOUDFLARE_PAGES_FALLBACK_BOUNDARY=PASS'

  windows-powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell proof scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            'scripts\check-testnet-access.ps1',
            'scripts\run-local-testnet-proof.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              exit 1
            }
            Write-Host ("POWERSHELL_PARSE_PASS={0}" -f $file)
          }
