name: proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run deterministic invariants and red-team suite
        run: npm run test:all
      - name: Verify portable Agent OS skill and MCP composition packaging
        run: |
          test -f skills/valid-until/SKILL.md
          grep -q '^name: valid-until$' skills/valid-until/SKILL.md
          grep -q 'Reasoning is not authorization' skills/valid-until/SKILL.md
          test -f AGENTS.md
          grep -q 'NO LONGER VALID' AGENTS.md
          test -f config/mcp-composition.example.json
          grep -q 'https://agent.binance.com/mcp/agentic' config/mcp-composition.example.json
          grep -q 'src/mcp-server.mjs' config/mcp-composition.example.json
          test -f src/binance-mcp-observation.mjs
      - name: Rebuild judge data and challenge evidence
        run: npm run build:web

  windows-powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell proof scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            'scripts\check-testnet-access.ps1',
            'scripts\run-local-testnet-proof.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              exit 1
            }
            Write-Host ("POWERSHELL_PARSE_PASS={0}" -f $file)
          }
