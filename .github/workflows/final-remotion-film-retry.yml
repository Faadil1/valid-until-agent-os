name: Final Remotion Evidence Film Retry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-remotion-film-retry.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reuse canonical Remotion scaffold from first pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          p='.github/workflows/final-remotion-film.yml'
          with open(p,encoding='utf-8') as f:
              data=yaml.safe_load(f)
          steps=data['jobs']['render']['steps']
          step=next(s for s in steps if s.get('name')=='Scaffold isolated Remotion packaging workspace')
          with open('/tmp/remotion-scaffold.sh','w',encoding='utf-8') as f:
              f.write(step['run'])
          PY
          bash /tmp/remotion-scaffold.sh

      - name: Install video dependencies
        working-directory: video/final-film
        run: npm install --no-audit --no-fund

      - name: Install Chromium and ffmpeg
        shell: bash
        working-directory: video/final-film
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Capture current deployed evidence surfaces
        working-directory: video/final-film
        run: npm run capture

      - name: Generate and fit calm narrative English voiceover
        shell: bash
        working-directory: video/final-film
        run: |
          set -euo pipefail
          python3 -m pip install --quiet edge-tts

          # The prior promotional voice was rejected by the human reviewer.
          # Ryan is the already-verified calmer British narrator. Generate at a
          # natural documentary pace, then make only a small deterministic tempo
          # correction so the complete narration ends before the 62s visual close.
          VOICE='en-GB-RyanNeural'
          TARGET_SECONDS='59.6'

          edge-tts \
            --voice "$VOICE" \
            --rate='+18%' \
            --pitch='-2Hz' \
            --volume='-2%' \
            --file voiceover.txt \
            --write-media public/voiceover-raw.mp3

          RAW_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/voiceover-raw.mp3)
          TEMPO=$(python3 - <<PY
          d=float('${RAW_DURATION}')
          target=float('${TARGET_SECONDS}')
          tempo=d/target
          if not 0.5 <= tempo <= 2.0:
              raise SystemExit(f'unsafe atempo factor: {tempo}')
          print(f'{tempo:.8f}')
          PY
          )

          ffmpeg -y -loglevel error -i public/voiceover-raw.mp3 \
            -filter:a "atempo=${TEMPO},loudnorm=I=-17:TP=-1.8:LRA=12" \
            public/voiceover.mp3

          NORMALIZED_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/voiceover.mp3)
          python3 - <<PY
          d=float('${NORMALIZED_DURATION}')
          if not 59.0 <= d <= 60.5:
              raise SystemExit(f'normalized voiceover outside safe film window: {d}')
          PY

          echo "VOICE=${VOICE}"
          echo "VOICE_PROFILE=CALM_NARRATIVE_CAPTIVATING"
          echo "RAW_VOICEOVER_SECONDS=${RAW_DURATION}"
          echo "VOICEOVER_TEMPO=${TEMPO}"
          echo "NORMALIZED_VOICEOVER_SECONDS=${NORMALIZED_DURATION}"

      - name: Render 1080p final evidence film
        working-directory: video/final-film
        run: npm run render

      - name: Inspect encoded artifact
        shell: bash
        working-directory: video/final-film
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration,size,bit_rate -of json out/valid-until-final.mp4 | tee out/ffprobe.json
          test -s out/valid-until-final.mp4

      - name: Upload final film and live capture package
        uses: actions/upload-artifact@v4
        with:
          name: valid-until-final-remotion-film-narrative-voice-v2
          path: |
            video/final-film/out/valid-until-final.mp4
            video/final-film/out/ffprobe.json
            video/final-film/public/hero.jpg
            video/final-film/public/stage-before.jpg
            video/final-film/public/stage-after.jpg
            video/final-film/public/evaluations.jpg
            video/final-film/public/live-proof.jpg
          if-no-files-found: error
          retention-days: 30
