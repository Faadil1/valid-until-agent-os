name: Final Remotion Evidence Film

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-remotion-film.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scaffold isolated Remotion packaging workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p video/final-film/src video/final-film/scripts video/final-film/public/replay video/final-film/out

          cat > video/final-film/package.json <<'JSON'
          {
            "private": true,
            "type": "module",
            "scripts": {
              "capture": "node scripts/capture-live-assets.mjs",
              "render": "remotion render src/index.jsx ValidUntilFinal out/valid-until-final.mp4 --codec=h264 --crf=18 --audio-codec=aac --concurrency=2"
            },
            "dependencies": {
              "@remotion/cli": "4.0.506",
              "@remotion/media": "4.0.506",
              "playwright": "1.55.0",
              "react": "19.1.1",
              "react-dom": "19.1.1",
              "remotion": "4.0.506"
            }
          }
          JSON

          cat > video/final-film/voiceover.txt <<'TXT'
          A correct decision can expire. Reasoning is not authorization. An AI agent can decide correctly at T zero, then reach execution after its premise has changed. A preflight asks whether an action is acceptable now. Valid Until asks whether this exact old action is still justified by the decision that produced it. The agent proposes, Binance Agent OS supplies fresh state, and Valid Until revalidates that decision contract. Replay. The market moves thirty-five point four seven basis points, past the original twenty-basis-point bound. Yet current checks still pass four out of four, and the exact action still matches. Fresh does not mean same premise. The decision is no longer valid: replan required. Six deterministic cases test clean allow, drift, expiry, tamper, policy mismatch, and action mutation. Separately, one authenticated Binance Spot Testnet order was previously executed and queried back under ALLOW — non-production, no real funds, and this page creates no new order. The model can propose. It cannot authorize itself. Valid Until. A correct decision can expire.
          TXT

          cat > video/final-film/src/index.jsx <<'JSX'
          import React from 'react';
          import {Composition, registerRoot} from 'remotion';
          import {ValidUntilFinal} from './ValidUntilFinal.jsx';

          const Root = () => (
            <Composition
              id="ValidUntilFinal"
              component={ValidUntilFinal}
              durationInFrames={1860}
              fps={30}
              width={1920}
              height={1080}
            />
          );

          registerRoot(Root);
          JSX

          cat > video/final-film/src/ValidUntilFinal.jsx <<'JSX'
          import React from 'react';
          import {AbsoluteFill, Easing, Img, Sequence, interpolate, staticFile, useCurrentFrame, useVideoConfig} from 'remotion';
          import {Audio} from '@remotion/media';

          const C = {
            paper: '#f2eee4',
            paper2: '#e9e2d4',
            ink: '#171815',
            muted: '#6e6b63',
            acid: '#e9ff4a',
            orange: '#f05b34',
            green: '#1d6b50',
            white: '#fffdf7',
          };

          const mono = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
          const serif = 'Georgia, Times New Roman, serif';

          const Fade = ({children, from = 0, to = 18}) => {
            const frame = useCurrentFrame();
            return <div style={{opacity: interpolate(frame, [from, to], [0, 1], {extrapolateLeft:'clamp', extrapolateRight:'clamp', easing:Easing.bezier(.16,1,.3,1)})}}>{children}</div>;
          };

          const EvidenceLabel = ({children, tone='acid'}) => (
            <div style={{display:'inline-flex', alignItems:'center', gap:12, padding:'10px 14px', border:`2px solid ${C.ink}`, background:tone==='orange'?C.orange:tone==='white'?C.white:C.acid, color:C.ink, fontFamily:mono, fontWeight:900, fontSize:20, letterSpacing:'0.08em', textTransform:'uppercase', boxShadow:`4px 4px 0 ${C.ink}`}}>{children}</div>
          );

          const Screenshot = ({src, scale=1, x=0, y=0, radius=8}) => (
            <div style={{position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden'}}>
              <Img src={staticFile(src)} style={{maxWidth:'100%', maxHeight:'100%', objectFit:'contain', scale, translate:`${x}px ${y}px`, borderRadius:radius, boxShadow:'0 28px 80px rgba(23,24,21,.16)'}} />
            </div>
          );

          const SceneShell = ({eyebrow, children}) => (
            <AbsoluteFill style={{backgroundColor:C.paper, color:C.ink, padding:'42px 54px 40px'}}>
              <div style={{position:'absolute', left:54, right:54, top:36, display:'flex', justifyContent:'space-between', alignItems:'center', zIndex:20, fontFamily:mono, fontWeight:900, fontSize:16, letterSpacing:'0.1em', textTransform:'uppercase'}}>
                <div style={{display:'flex', alignItems:'center', gap:12}}><span style={{display:'inline-block', width:14, height:14, background:C.acid, border:`2px solid ${C.ink}`, boxShadow:`3px 3px 0 ${C.ink}`}}/>VALID UNTIL</div>
                <span style={{color:C.muted}}>{eyebrow}</span>
              </div>
              <div style={{position:'absolute', left:54, right:54, top:74, height:2, background:C.ink, opacity:.9}}/>
              {children}
            </AbsoluteFill>
          );

          const HeroScene = () => {
            const frame = useCurrentFrame();
            const scale = interpolate(frame, [0,150], [1.02,1.08], {extrapolateRight:'clamp', easing:Easing.bezier(.16,1,.3,1)});
            return <SceneShell eyebrow="01 · PAIN / PROBLEM">
              <Screenshot src="hero.jpg" scale={scale} y={30}/>
              <div style={{position:'absolute', left:86, bottom:70, zIndex:30}}>
                <Fade><EvidenceLabel>A correct decision can expire.</EvidenceLabel></Fade>
              </div>
            </SceneShell>;
          };

          const DifferentiatorScene = () => {
            const frame = useCurrentFrame();
            const left = interpolate(frame, [0,24], [-32,0], {extrapolateRight:'clamp', easing:Easing.bezier(.16,1,.3,1)});
            const right = interpolate(frame, [8,32], [32,0], {extrapolateLeft:'clamp', extrapolateRight:'clamp', easing:Easing.bezier(.16,1,.3,1)});
            return <SceneShell eyebrow="02 · DIFFERENTIATOR">
              <div style={{position:'absolute', inset:'130px 72px 72px', display:'grid', gridTemplateColumns:'1fr 1fr', gap:22, alignItems:'stretch'}}>
                <div style={{border:`2px solid ${C.ink}`, background:C.white, padding:'52px 48px', translate:`${left}px 0`, opacity:interpolate(frame,[0,18],[0,1],{extrapolateRight:'clamp'})}}>
                  <div style={{fontFamily:mono, fontSize:18, color:C.muted, fontWeight:800, letterSpacing:'.08em', textTransform:'uppercase', marginBottom:30}}>Current-state preflight asks</div>
                  <div style={{fontFamily:serif, fontSize:56, lineHeight:1.04, letterSpacing:'-.035em'}}>Is this action acceptable <em style={{fontStyle:'normal', background:C.acid}}>now?</em></div>
                </div>
                <div style={{border:`2px solid ${C.ink}`, background:C.paper2, padding:'52px 48px', translate:`${right}px 0`, opacity:interpolate(frame,[8,28],[0,1],{extrapolateLeft:'clamp',extrapolateRight:'clamp'})}}>
                  <div style={{fontFamily:mono, fontSize:18, color:C.muted, fontWeight:800, letterSpacing:'.08em', textTransform:'uppercase', marginBottom:30}}>Valid Until asks</div>
                  <div style={{fontFamily:serif, fontSize:56, lineHeight:1.04, letterSpacing:'-.035em'}}>Is this exact old action still justified by the <span style={{borderBottom:`10px solid ${C.acid}`}}>decision that produced it?</span></div>
                </div>
              </div>
            </SceneShell>;
          };

          const ArchitectureScene = () => {
            const frame = useCurrentFrame();
            const p = interpolate(frame,[0,100],[0,1],{extrapolateRight:'clamp'});
            return <SceneShell eyebrow="03 · EXECUTION">
              <div style={{position:'absolute', inset:'150px 90px 120px', display:'flex', flexDirection:'column', justifyContent:'center'}}>
                <div style={{display:'grid', gridTemplateColumns:'1fr auto 1fr auto 1.2fr', alignItems:'center', gap:24}}>
                  {['AI AGENT\nPROPOSES','BINANCE AGENT OS\nFRESH STATE','VALID UNTIL\nREVALIDATES'].map((t,i)=><React.Fragment key={t}>{i>0 && <div style={{fontFamily:serif,fontSize:64,color:i===2?C.orange:C.ink,opacity:.8}}>→</div>}<div style={{minHeight:240,border:`2px solid ${C.ink}`,background:i===2?C.acid:C.white,padding:'46px 32px',display:'grid',placeItems:'center',textAlign:'center',fontFamily:mono,fontSize:30,fontWeight:900,lineHeight:1.35,whiteSpace:'pre-line',scale:interpolate(frame,[i*10,i*10+22],[.94,1],{extrapolateLeft:'clamp',extrapolateRight:'clamp',easing:Easing.bezier(.16,1,.3,1)}),opacity:interpolate(frame,[i*10,i*10+18],[0,1],{extrapolateLeft:'clamp',extrapolateRight:'clamp'})}}>{t}</div></React.Fragment>)}
                </div>
                <div style={{height:2, background:C.ink, margin:'42px 0 22px'}}/>
                <div style={{fontFamily:mono, fontSize:22, lineHeight:1.5, color:C.muted, textAlign:'center'}}>policy + T0 state + exact action <b style={{color:C.ink}}>→ short-lived action-decision contract →</b> ALLOW | REPLAN_REQUIRED</div>
              </div>
            </SceneShell>;
          };

          const ReceiptScene = () => {
            const frame = useCurrentFrame();
            return <SceneShell eyebrow="04 · SEALED T0 CONTRACT">
              <div style={{position:'absolute', inset:'132px 86px 72px', display:'grid', gridTemplateColumns:'0.72fr 1.28fr', gap:32, alignItems:'center'}}>
                <div style={{position:'relative', height:'100%'}}><Screenshot src="ticket.jpg" scale={interpolate(frame,[0,120],[.96,1.04],{extrapolateRight:'clamp'})}/></div>
                <div style={{padding:'30px 12px'}}>
                  <div style={{fontFamily:mono,fontSize:18,fontWeight:900,color:C.muted,letterSpacing:'.1em',textTransform:'uppercase'}}>Receipt v2 · action-bound</div>
                  <div style={{fontFamily:serif,fontSize:68,lineHeight:.98,letterSpacing:'-.045em',marginTop:24}}>Policy, T0 state and the exact action are <span style={{background:C.acid}}>one contract.</span></div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginTop:40}}>{['POLICY SEALED','T0 SNAPSHOT','ACTION HASH'].map((x,i)=><div key={x} style={{border:`2px solid ${C.ink}`,background:C.white,padding:'22px 18px',fontFamily:mono,fontSize:18,fontWeight:900,opacity:interpolate(frame,[12+i*8,28+i*8],[0,1],{extrapolateLeft:'clamp',extrapolateRight:'clamp'})}}>{x}<div style={{fontSize:13,color:C.green,marginTop:8}}>BOUND</div></div>)}</div>
                </div>
              </div>
            </SceneShell>;
          };

          const ReplayScene = () => {
            const frame = useCurrentFrame();
            const idx = Math.min(27, Math.max(0, Math.floor(frame / 4)));
            const img = `replay/frame-${String(idx).padStart(2,'0')}.jpg`;
            const clickOpacity = interpolate(frame,[0,8,16],[1,1,0],{extrapolateRight:'clamp'});
            return <SceneShell eyebrow="05 · LIVE SCREEN CAPTURE / CONTROLLED REPLAY">
              <div style={{position:'absolute', inset:'118px 60px 48px'}}><Screenshot src={img} scale={1}/></div>
              <div style={{position:'absolute',right:108,top:155,zIndex:40,opacity:clickOpacity}}>
                <div style={{width:32,height:32,borderRadius:'50%',border:`4px solid ${C.orange}`,boxShadow:`0 0 0 ${interpolate(frame,[0,10],[0,22],{extrapolateRight:'clamp'})}px rgba(240,91,52,.18)`}}/>
                <div style={{fontFamily:mono,fontWeight:900,fontSize:16,background:C.acid,border:`2px solid ${C.ink}`,padding:'8px 10px',marginTop:8}}>REPLAY PROOF</div>
              </div>
            </SceneShell>;
          };

          const SignatureScene = () => {
            const frame = useCurrentFrame();
            const bars = [
              ['CURRENT STATE CHECKS','PASS 4/4',C.green],
              ['EXACT ACTION HASH','MATCH',C.green],
              ['T0 → T1 PREMISE','FAIL 35.47 > 20 BPS',C.orange],
            ];
            return <SceneShell eyebrow="06 · EVIDENCE / STORY">
              <div style={{position:'absolute',inset:'128px 78px 66px',display:'grid',gridTemplateColumns:'1.08fr .92fr',gap:30}}>
                <div style={{position:'relative',overflow:'hidden',border:`2px solid ${C.ink}`,background:C.white}}><Screenshot src="stage-after.jpg" scale={1.04}/></div>
                <div style={{display:'flex',flexDirection:'column',justifyContent:'center',gap:14}}>
                  {bars.map(([k,v,c],i)=><div key={k} style={{border:`2px solid ${C.ink}`,background:i===2?C.orange:C.white,padding:'22px 26px',opacity:interpolate(frame,[i*10,i*10+18],[0,1],{extrapolateLeft:'clamp',extrapolateRight:'clamp'}),translate:`${interpolate(frame,[i*10,i*10+18],[20,0],{extrapolateLeft:'clamp',extrapolateRight:'clamp'})}px 0`}}><div style={{fontFamily:mono,fontSize:16,fontWeight:800,color:i===2?C.ink:C.muted,letterSpacing:'.08em'}}>{k}</div><div style={{fontFamily:serif,fontSize:i===2?46:54,lineHeight:.95,fontWeight:700,marginTop:8,color:i===2?C.ink:c}}>{v}</div></div>)}
                  <div style={{marginTop:10,fontFamily:serif,fontSize:58,lineHeight:.9,letterSpacing:'-.04em'}}>Fresh does not mean <span style={{borderBottom:`10px solid ${C.acid}`}}>same premise.</span></div>
                  <div style={{display:'flex',gap:12,marginTop:10}}><EvidenceLabel tone="orange">NO LONGER VALID</EvidenceLabel><EvidenceLabel tone="white">REPLAN_REQUIRED</EvidenceLabel></div>
                </div>
              </div>
            </SceneShell>;
          };

          const EvaluationsScene = () => {
            const frame = useCurrentFrame();
            return <SceneShell eyebrow="07 · REPEATABILITY">
              <div style={{position:'absolute', inset:'118px 62px 50px'}}><Screenshot src="evaluations.jpg" scale={1.02}/></div>
              <div style={{position:'absolute',right:92,bottom:72,zIndex:30,scale:interpolate(frame,[0,24],[.82,1],{extrapolateRight:'clamp',easing:Easing.bezier(.16,1,.3,1)})}}><EvidenceLabel>6 / 6 DETERMINISTIC CASES</EvidenceLabel></div>
            </SceneShell>;
          };

          const LiveProofScene = () => {
            const frame = useCurrentFrame();
            return <SceneShell eyebrow="08 · VERIFIED EXECUTION">
              <div style={{position:'absolute',inset:'118px 62px 50px'}}><Screenshot src="live-proof.jpg" scale={1.02}/></div>
              <div style={{position:'absolute',left:88,bottom:68,zIndex:30,display:'flex',gap:12,alignItems:'center',opacity:interpolate(frame,[0,20],[0,1],{extrapolateRight:'clamp'})}}>
                <EvidenceLabel tone="white">HISTORICAL · FILLED · SAME ORDER VERIFIED</EvidenceLabel>
                <EvidenceLabel>NON-PRODUCTION · NO REAL FUNDS</EvidenceLabel>
              </div>
            </SceneShell>;
          };

          const CloseScene = () => {
            const frame = useCurrentFrame();
            return <SceneShell eyebrow="09 · CLOSE">
              <div style={{position:'absolute',inset:'135px 92px 90px',display:'grid',gridTemplateColumns:'1.1fr .9fr',gap:52,alignItems:'center'}}>
                <div>
                  <div style={{fontFamily:mono,fontWeight:900,fontSize:18,letterSpacing:'.11em',textTransform:'uppercase',color:C.muted,marginBottom:24}}>Agent-native execution validity</div>
                  <div style={{fontFamily:serif,fontSize:88,lineHeight:.9,letterSpacing:'-.055em'}}>The model can propose.<br/><span style={{background:C.acid}}>It cannot authorize itself.</span></div>
                  <div style={{fontFamily:mono,fontSize:20,color:C.muted,marginTop:36}}>VALID UNTIL · ACTION-BOUND DECISION CONTRACT ACROSS TIME</div>
                </div>
                <div style={{border:`2px solid ${C.ink}`,background:C.white,padding:'46px 40px',boxShadow:`12px 12px 0 ${C.paper2}`,rotate:'-1deg',scale:interpolate(frame,[0,50],[.94,1],{extrapolateRight:'clamp',easing:Easing.bezier(.16,1,.3,1)})}}>
                  <div style={{fontFamily:mono,fontSize:16,fontWeight:900,color:C.muted,letterSpacing:'.1em'}}>24-HOUR JUDGE MEMORY</div>
                  <div style={{fontFamily:serif,fontSize:58,lineHeight:.98,letterSpacing:'-.04em',marginTop:28}}>A correct decision <span style={{color:C.orange}}>can expire.</span></div>
                </div>
              </div>
            </SceneShell>;
          };

          export const ValidUntilFinal = () => {
            return <AbsoluteFill style={{backgroundColor:C.paper}}>
              <Audio src={staticFile('voiceover.mp3')} />
              <Sequence from={0} durationInFrames={150}><HeroScene/></Sequence>
              <Sequence from={150} durationInFrames={180}><DifferentiatorScene/></Sequence>
              <Sequence from={330} durationInFrames={120}><ArchitectureScene/></Sequence>
              <Sequence from={450} durationInFrames={210}><ReceiptScene/></Sequence>
              <Sequence from={660} durationInFrames={360}><ReplayScene/></Sequence>
              <Sequence from={1020} durationInFrames={210}><SignatureScene/></Sequence>
              <Sequence from={1230} durationInFrames={180}><EvaluationsScene/></Sequence>
              <Sequence from={1410} durationInFrames={240}><LiveProofScene/></Sequence>
              <Sequence from={1650} durationInFrames={210}><CloseScene/></Sequence>
            </AbsoluteFill>;
          };
          JSX

          cat > video/final-film/scripts/capture-live-assets.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const base = 'https://valid-until-agent-os-plum.vercel.app';
          const out = path.resolve('public');
          await fs.mkdir(path.join(out, 'replay'), {recursive:true});

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:900}, deviceScaleFactor:1});
          page.setDefaultTimeout(15000);

          const shot = async (locator, file) => {
            await locator.screenshot({path:path.join(out,file), type:'jpeg', quality:90, animations:'allow'});
          };

          const response = await page.goto(`${base}/`, {waitUntil:'networkidle'});
          if (!response || response.status() !== 200) throw new Error(`Home HTTP ${response?.status()}`);
          await page.screenshot({path:path.join(out,'hero.jpg'),type:'jpeg',quality:90,fullPage:false});
          await shot(page.locator('.ticket').first(),'ticket.jpg');
          await page.locator('.stage').scrollIntoViewIfNeeded();
          await shot(page.locator('.stage').first(),'stage-before.jpg');

          const replay = page.getByRole('button',{name:/Replay proof/i});
          await replay.click();
          for (let i=0;i<28;i++) {
            await shot(page.locator('.stage').first(),`replay/frame-${String(i).padStart(2,'0')}.jpg`);
            await page.waitForTimeout(125);
          }
          await page.getByText('NO LONGER VALID',{exact:true}).waitFor({state:'visible'});
          await shot(page.locator('.stage').first(),'stage-after.jpg');

          const evalRes = await page.goto(`${base}/evaluations`,{waitUntil:'networkidle'});
          if (!evalRes || evalRes.status() !== 200) throw new Error(`Evaluations HTTP ${evalRes?.status()}`);
          await page.screenshot({path:path.join(out,'evaluations.jpg'),type:'jpeg',quality:90,fullPage:false});

          const liveRes = await page.goto(`${base}/live-proof`,{waitUntil:'networkidle'});
          if (!liveRes || liveRes.status() !== 200) throw new Error(`Live proof HTTP ${liveRes?.status()}`);
          await page.screenshot({path:path.join(out,'live-proof.jpg'),type:'jpeg',quality:90,fullPage:false});

          await browser.close();
          console.log('LIVE_ASSET_CAPTURE=PASS');
          JS

      - name: Install video dependencies
        working-directory: video/final-film
        run: npm install --no-audit --no-fund

      - name: Install Chromium for live evidence capture
        working-directory: video/final-film
        run: npx playwright install --with-deps chromium

      - name: Capture current deployed evidence surfaces
        working-directory: video/final-film
        run: npm run capture

      - name: Generate English judge voiceover
        shell: bash
        working-directory: video/final-film
        run: |
          set -euo pipefail
          python3 -m pip install --quiet edge-tts
          edge-tts --voice en-US-GuyNeural --rate='+2%' --file voiceover.txt --write-media public/voiceover-raw.mp3
          RAW_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/voiceover-raw.mp3)
          TEMPO=$(python3 - <<PY
          d=float('${RAW_DURATION}')
          target=59.2
          print(max(0.85,min(1.18,d/target)))
          PY
          )
          ffmpeg -y -loglevel error -i public/voiceover-raw.mp3 -filter:a "atempo=${TEMPO},loudnorm=I=-16:TP=-1.5:LRA=11" public/voiceover.mp3
          echo "RAW_VOICEOVER_SECONDS=${RAW_DURATION}"
          echo "VOICEOVER_TEMPO=${TEMPO}"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/voiceover.mp3

      - name: Render 1080p final evidence film
        working-directory: video/final-film
        run: npm run render

      - name: Inspect encoded artifact
        shell: bash
        working-directory: video/final-film
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration,size,bit_rate -of json out/valid-until-final.mp4 | tee out/ffprobe.json
          test -s out/valid-until-final.mp4

      - name: Upload final film and live capture package
        uses: actions/upload-artifact@v4
        with:
          name: valid-until-final-remotion-film
          path: |
            video/final-film/out/valid-until-final.mp4
            video/final-film/out/ffprobe.json
            video/final-film/public/hero.jpg
            video/final-film/public/stage-before.jpg
            video/final-film/public/stage-after.jpg
            video/final-film/public/evaluations.jpg
            video/final-film/public/live-proof.jpg
          if-no-files-found: error
          retention-days: 30
