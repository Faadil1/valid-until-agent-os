project: Valid Until
project_type: HACKATHON
hackathon: Binance Agent OS Mini Hackathon
track: A
canonical_thesis: Reasoning is not authorization.
secondary_thesis: A correct decision can expire.
judge_line: The authorization was still valid. The premise was not.

handover_discipline:
  source_of_truth: GitHub_repository_state
  canonical_current: state/CURRENT.yaml
  canonical_handover: state/HANDOVER.yaml
  rule: >-
    A new conversation must read CURRENT and HANDOVER first. Update both after every material
    lifecycle transition. Chat memory is not authority and retrospective history must never be falsified.

current_stage: PBPD_GITHUB_TESTNET_WORKFLOW_PACKAGING
current_owner: PBPD
terminal_completeness_allowed: false

human_secret_boundary:
  environment: testnet-proof
  secrets:
    - BINANCE_TESTNET_API_KEY
    - BINANCE_TESTNET_API_SECRET
  status: CONFIRMED_BY_HUMAN_VALUES_NOT_READ_BY_ASSISTANT
  values_must_never_be_requested_or_displayed: true
  vercel_secret_access: FORBIDDEN

product_contract:
  agent_role: interpret intent and propose exact action; never self-authorize
  binance_role: sponsor-native observations/capability surface plus official Spot Testnet venue
  valid_until_role: bind sealed policy + T0 state + exact action and revalidate at T1
  receipt_contract: valid-until.receipt.v2
  BLOCK: REPLAN_REQUIRED_WITH_ZERO_EXECUTOR_CALLS
  ALLOW: MAY_REACH_BOUNDED_SPOT_TESTNET_EXECUTOR

unique_category:
  generic_preflight_question: Is this action acceptable now?
  valid_until_question: Is this exact previously justified action still valid relative to the premise that justified it?
  memory_sentence: Fresh enough now is not the same as still justified then.

competition_context:
  x_api_sweep_posts: 395
  track_a_explicit_or_likely_rows_before_dedupe: 119
  latest_winner_intelligence: product/WINNER-INTELLIGENCE-RERUN-004-X-API.md
  critical_correction: >-
    Do not claim temporal drift, expiry or deterministic authorization are globally unique.
    Valid Until must win on the central action-decision cross-time contract.

verified_implementation:
  core_tests: PASS_8_OF_8
  challenge_suite: PASS_6_OF_6
  mcp_smoke: PASS_5_OF_5
  mcp_observation_adapter: PASS_4_OF_4
  testnet_execution_boundary: PASS_5_OF_5
  latest_known_ci: 34243272141_SUCCESS
  controlled_replay: ELIGIBLE_TO_BLOCK_AT_35_47_BPS_VS_20_BPS
  prior_public_binance_read_proof: 34225133745

live_testnet_path:
  environment: BINANCE_SPOT_TESTNET_ONLY
  endpoint: https://testnet.binance.vision
  market_capture: src/snapshot.mjs::captureWithBinanceSpotTestnet
  executor: src/testnet-executor.mjs
  orchestrator: src/live-testnet.mjs
  supported_action: BUY_with_quote_notional_usdt
  default_notional_usdt: 10
  write_confirmation: VALID_UNTIL_TESTNET_WRITE=CONFIRM_TESTNET_WRITE
  allow_behavior: one signed MARKET BUY then query same clientOrderId
  block_behavior: zero executor calls
  mainnet_fallback: FORBIDDEN_AND_NOT_IMPLEMENTED

security_and_claim_boundaries:
  - no_mainnet_trade
  - no_real_funds
  - no_geo_bypass
  - no_wallet_write
  - no_x402
  - no_secret_in_repo_logs_chat_artifacts_or_vercel
  - Spot_Testnet_is_non_production
  - do_not_weaken_policy_to_force_ALLOW
  - BLOCK_is_valid_live_evidence
  - no_profitability_alpha_or_financial_safety_claim

human_requested_scope:
  stop_after_step: 5
  steps:
    1_secret_installation: COMPLETE
    2_manual_testnet_workflow: IN_PROGRESS
    3_real_testnet_capture: PENDING
    4_sanitized_proof: PENDING
    5_judge_surface_vercel: PENDING
  after_step_5_do_not_continue_without_new_instruction:
    - pbpd_final_reconciliation
    - trace_delta_assurance
    - winning_intelligence_final_recheck
    - trace_6_75_video
    - project_finisher
    - protected_submission

workflow_contract_to_build:
  filename: .github/workflows/live-testnet-proof.yml
  trigger: workflow_dispatch_only
  environment: testnet-proof
  runner_profile: ephemeral
  credentials:
    api_key: secrets.BINANCE_TESTNET_API_KEY
    api_secret: secrets.BINANCE_TESTNET_API_SECRET
  no_shell_xtrace: true
  no_secret_echo: true
  target: hardcoded_testnet_only
  raw_proof_publication: forbidden
  sanitized_target: web/live-testnet-proof.json
  public_route: /live-proof
  workflow_commit_may_publish_sanitized_proof_only: true

important_tooling_constraint:
  note: >-
    The GitHub connector available in chat can create/update workflow files and inspect runs,
    but currently exposes no initial workflow_dispatch action. Do not change a write workflow to push-triggered
    simply to bypass this. If dispatch remains unavailable, request exactly one human Run workflow click.

next_valid_handoff:
  from: PBPD
  to: HUMAN_WORKFLOW_DISPATCH_BOUNDARY_OR_RUNTIME_CAPTURE
  required_output: >-
    Complete workflow/sanitizer/public-surface packaging and CI. If no connector dispatch exists,
    stop and ask the human to click Actions -> live-binance-spot-testnet-proof -> Run workflow on main.
    Then resume by inspecting the real run, sanitize proof and complete Vercel publication.

resume_rule: >-
  Do not return to video/TRACE/Project Finisher yet. First complete steps 2-5 of the requested scope.
  Never request the secret values. Never infer a real order from workflow readiness; only a real authenticated run counts.
