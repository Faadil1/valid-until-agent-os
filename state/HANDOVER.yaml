project: Valid Until
project_type: HACKATHON
hackathon: Binance Agent OS Mini Hackathon
track: A
canonical_thesis: Reasoning is not authorization.
secondary_thesis: A correct decision can expire.
judge_line: The authorization was still valid. The premise was not.

current_stage: LIVE_BINANCE_SPOT_TESTNET_CAPTURE_REQUIRED
current_owner: HUMAN_EXECUTION_BOUNDARY
terminal_completeness_allowed: false

human_direction:
  artifact: product/HUMAN-DIRECTION-LIVE-PROOF-001.md
  decision: >-
    Final differentiation proof should not stop at read-only authenticity.
    Add live Binance Spot Testnet execution evidence, without real funds or mainnet trading.

product_contract:
  human_role: define/accept policy and retain protected external authority
  agent_role: interpret intent and propose an exact action; never self-authorize
  binance_role: provide live observations/capability surface
  valid_until_role: bind sealed policy + T0 state + exact action and revalidate at T1
  receipt_contract: valid-until.receipt.v2
  terminal_states: [ALLOW, BLOCK]
  block_handoff: REPLAN_REQUIRED

unique_category:
  generic_preflight_question: Is this action acceptable now?
  valid_until_question: Is this exact previously justified action still valid relative to the premise that justified it?
  memory_sentence: Fresh enough now is not the same as still justified then.

verified_implementation:
  core_tests: PASS_8_OF_8
  challenge_suite: PASS_6_OF_6
  mcp_smoke: PASS_5_OF_5
  mcp_observation_adapter: PASS_4_OF_4
  testnet_execution_boundary: PASS_5_OF_5
  full_ci_run: 34242858075
  full_ci_head: 18e0bd6006134010fca00b4d05667b87703bbb75
  full_ci_conclusion: SUCCESS
  controlled_replay: ELIGIBLE_TO_BLOCK_AT_35_47_BPS_VS_20_BPS
  prior_public_live_binance_cli:
    run: 34225133745
    result: BLOCK_FAIL_CLOSED
    artifact: 10055364283
    digest: sha256:51b23c621e487be68c81138bd3a24e6c264e4fb00a0c315b88addf8080e6b370

agent_os_composition:
  official_remote_mcp_example: config/mcp-composition.example.json
  local_mcp: src/mcp-server.mjs
  local_tools: [valid_until_begin, valid_until_revalidate]
  observation_adapter: src/binance-mcp-observation.mjs
  distinction: >-
    Binance MCP/official Binance tools answer what is true now.
    Valid Until MCP answers whether the exact old action remains justified.

live_testnet_path:
  status: IMPLEMENTED_NOT_YET_AUTHENTICATED_CAPTURED
  official_environment: https://testnet.binance.vision
  market_capture: src/snapshot.mjs::captureWithBinanceSpotTestnet
  executor: src/testnet-executor.mjs
  orchestrator: src/live-testnet.mjs
  command: npm run live:testnet -- BTCUSDT
  supported_action: BUY_with_quote_notional_usdt
  write_confirmation: VALID_UNTIL_TESTNET_WRITE=CONFIRM_TESTNET_WRITE
  profile_variable: VALID_UNTIL_TESTNET_PROFILE
  allow_behavior: one signed MARKET BUY then query same clientOrderId
  block_behavior: zero executor calls
  target_override_to_mainnet: impossible_by_current_executor_contract

security_and_scope:
  - use only personal development machine for credentials/execution
  - no API secret in repository/chat/log/screenshot
  - no mainnet Binance order
  - no real funds
  - no geographic bypass
  - no wallet funding/write
  - no x402
  - do not weaken policy to manufacture ALLOW
  - a BLOCK live run is legitimate evidence and requires fresh replan

claim_boundaries:
  implemented_claims:
    - action-bound receipt v2
    - deterministic cross-time revalidation
    - testnet executor structurally gated on ALLOW
    - testnet target hardcoded
    - full CI green
  pending_claims:
    - real authenticated Binance Spot Testnet order placed
    - real testnet orderId/clientOrderId/status observed
  forbidden_claims:
    - mainnet live trade
    - real-money trade
    - profitability_or_alpha
    - reduced_real_world_losses
    - production_financial_safety
    - authenticated_remote_mcp_write_without_real_capture

competition_evidence:
  x_api_sweep: evidence/competition/X-OFFICIAL-THREAD-SWEEP-2026-09-08.md
  posts_captured: 395
  track_a_explicit_or_likely_rows_before_dedupe: 119
  latest_winner_intelligence: product/WINNER-INTELLIGENCE-RERUN-004-X-API.md
  key_correction: >-
    Do not claim temporal drift/proposal expiry is globally unique. RiskPilot and Trade Preflight
    contain temporal/freshness controls. Valid Until must win on action-decision contract centrality.

lifecycle_effect:
