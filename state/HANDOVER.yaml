project: Valid Until
canonical_thesis: Reasoning is not authorization.
judge_line: The authorization was still valid. The premise was not.
thesis: >-
  Freeze user execution constraints before reading the market, bind a decision to
  the exact Binance state that justified it, and require deterministic pre-action
  revalidation so stale reasoning cannot become a consequential action.
why_now: >-
  Multi-LLM problem discovery independently converged on stale-state execution as a
  core agentic-finance failure mode. Track A is crowded with signal scanners,
  AI confirmation loops, multi-timeframe trade-readiness tools, and trading bots.
  Valid Until differentiates on execution integrity rather than prediction.
architecture:
  agent_role: interpret intent and propose action; never self-authorize execution
  policy_commitment: SHA-256 canonical policy hash created before market read
  market_source: official binance-cli against public Binance market-data-only endpoints
  receipt: Ed25519 signed decision receipt bound to policy hash + snapshot hash + validity window
  revalidation: signature + policy + freshness + mid-price drift + current market checks
  terminal_states: [ALLOW, BLOCK]
  execution_adapter: intentionally_not_implemented
verified:
  - npm test => PASS 7/7
  - controlled replay => initial ELIGIBLE
  - controlled replay => final BLOCK at 35.47 bps drift vs 20 bps policy
  - official Binance CLI v2.1.1 installed and verified in GitHub Actions
  - live BTCUSDT public Binance capture => GitHub Actions run 34225133745 SUCCESS
  - live proof artifact => id 10055364283
  - live proof artifact digest => sha256:51b23c621e487be68c81138bd3a24e6c264e4fb00a0c315b88addf8080e6b370
  - live result => BLOCK, fail-closed on real market state
  - public GitHub repo => Faadil1/valid-until-agent-os
live_proof_interpretation: >-
  The real capture is supporting proof of the Binance-native read-only path and
  deterministic fail-closed enforcement. The captured market was already ineligible
  at T0 because top-5 ask depth was below the demo threshold, and receipt age also
  exceeded the strict 5-second threshold at revalidation. Therefore the controlled
  replay, not this live capture, remains the canonical VALID -> NO LONGER VALID hero case.
claim_boundaries:
  - no profitable-trading claim
  - no predictive-alpha claim
  - controlled replay is synthetic and labelled
  - live proof is authentic public Binance market data, not a trade
  - Ed25519 is supporting proof, not the headline value proposition
  - no API key, account credential, order placement or funding action was used
