project: Valid Until
project_type: HACKATHON
hackathon: Binance Agent OS Mini Hackathon
track: A
canonical_thesis: Reasoning is not authorization.
secondary_thesis: A correct decision can expire.
judge_line: The authorization was still valid. The premise was not.

handover_discipline:
  source_of_truth: GitHub_repository_state
  canonical_current: state/CURRENT.yaml
  canonical_handover: state/HANDOVER.yaml
  rule: >-
    Update CURRENT and HANDOVER after every material lifecycle change: gate, owner, blocker,
    proof, scope, claim boundary, deployment state, competition finding, or next handoff.
    A future conversation should be able to take the lead by reading these files first.
  chat_memory_is_not_authority: true
  backdating_or_falsified_history: forbidden

current_stage: GITHUB_TESTNET_SECRET_INSTALLATION_REQUIRED
current_owner: HUMAN_SECRET_BOUNDARY
terminal_completeness_allowed: false

human_direction:
  artifact: product/HUMAN-DIRECTION-LIVE-PROOF-001.md
  decision: >-
    Final differentiation proof should not stop at read-only authenticity.
    Add live Binance Spot Testnet execution evidence, without real funds or mainnet trading.

latest_operational_decision:
  id: HUMAN_GITHUB_ACTIONS_SECRET_ROUTE_001
  decision: >-
    Prefer GitHub Actions for the real Spot Testnet capture instead of requiring local WSL execution.
    Store testnet credentials only in a protected GitHub Environment and expose only sanitized evidence
    to Vercel/public artifacts.
  target_environment: testnet-proof
  required_environment_secrets:
    - BINANCE_TESTNET_API_KEY
    - BINANCE_TESTNET_API_SECRET
  current_secret_status: NOT_YET_CONFIRMED
  vercel_secret_access: FORBIDDEN

product_contract:
  human_role: define/accept policy, install protected secrets, and retain protected external authority
  agent_role: interpret intent and propose an exact action; never self-authorize
  binance_role: provide live observations/capability surface and official Spot Testnet execution venue
  valid_until_role: bind sealed policy + T0 state + exact action and revalidate at T1
  receipt_contract: valid-until.receipt.v2
  terminal_states: [ALLOW, BLOCK]
  block_handoff: REPLAN_REQUIRED

unique_category:
  generic_preflight_question: Is this action acceptable now?
  valid_until_question: Is this exact previously justified action still valid relative to the premise that justified it?
  memory_sentence: Fresh enough now is not the same as still justified then.

verified_implementation:
  core_tests: PASS_8_OF_8
  challenge_suite: PASS_6_OF_6
  mcp_smoke: PASS_5_OF_5
  mcp_observation_adapter: PASS_4_OF_4
  testnet_execution_boundary: PASS_5_OF_5
  full_ci_run: 34242858075
  full_ci_head: 18e0bd6006134010fca00b4d05667b87703bbb75
  full_ci_conclusion: SUCCESS
  controlled_replay: ELIGIBLE_TO_BLOCK_AT_35_47_BPS_VS_20_BPS
  prior_public_live_binance_cli:
    run: 34225133745
    result: BLOCK_FAIL_CLOSED
    artifact: 10055364283
    digest: sha256:51b23c621e487be68c81138bd3a24e6c264e4fb00a0c315b88addf8080e6b370

agent_os_composition:
  official_remote_mcp_example: config/mcp-composition.example.json
  local_mcp: src/mcp-server.mjs
  local_tools: [valid_until_begin, valid_until_revalidate]
  observation_adapter: src/binance-mcp-observation.mjs
  distinction: >-
    Binance MCP/official Binance tools answer what is true now.
    Valid Until MCP answers whether the exact old action remains justified.

live_testnet_path:
  implementation_status: IMPLEMENTED_AND_CI_TESTED
  authenticated_capture_status: PENDING
  official_environment: https://testnet.binance.vision
  market_capture: src/snapshot.mjs::captureWithBinanceSpotTestnet
  executor: src/testnet-executor.mjs
  orchestrator: src/live-testnet.mjs
  command: npm run live:testnet -- BTCUSDT
  supported_action: BUY_with_quote_notional_usdt
  write_confirmation: VALID_UNTIL_TESTNET_WRITE=CONFIRM_TESTNET_WRITE
  allow_behavior: one signed MARKET BUY then query same clientOrderId
  block_behavior: zero executor calls
  target_override_to_mainnet: impossible_by_current_executor_contract

planned_github_actions_capture:
  environment: testnet-proof
  workflow_trigger: manual_only
  credentials:
    api_key: secrets.BINANCE_TESTNET_API_KEY
    api_secret: secrets.BINANCE_TESTNET_API_SECRET
  runner_profile: ephemeral
  secret_echo: forbidden
  xtrace_or_shell_trace: forbidden
  endpoint: hardcoded_testnet_only
  sanitized_public_output_target: web/live-testnet-proof.json
  public_output_may_include:
    - network
    - captured_at
    - symbol
    - normalized_action
    - valid_until_result
    - testnet_orderId
    - testnet_clientOrderId
    - testnet_status
    - same_order_verified
    - evidence_hashes
  public_output_must_never_include:
    - api_key
    - api_secret
    - authorization_headers
    - raw_profile_file
    - account_credentials
  vercel_role: render sanitized proof only after successful evidence capture

security_and_scope:
  - no API secret in repository/chat/log/screenshot/artifact
  - protected GitHub Environment secrets are allowed for the manual testnet workflow
  - Vercel receives no Binance credential
  - no mainnet Binance order
  - no real funds
  - no geographic bypass
  - no wallet funding/write
  - no x402
  - do not weaken policy to manufacture ALLOW
  - a BLOCK live run is legitimate evidence and requires fresh replan
  - GitHub secret installation does not itself prove an execution occurred

claim_boundaries:
  implemented_claims:
    - action-bound receipt v2
    - deterministic cross-time revalidation
    - testnet executor structurally gated on ALLOW
    - testnet target hardcoded
    - full CI green
  pending_claims:
    - GitHub testnet-proof environment contains both required secrets
    - real authenticated Binance Spot Testnet order placed
    - real testnet orderId/clientOrderId/status observed
    - sanitized testnet proof published to judge surface
  forbidden_claims:
    - mainnet live trade
    - real-money trade
    - profitability_or_alpha
    - reduced_real_world_losses
    - production_financial_safety
    - authenticated_remote_mcp_write_without_real_capture

competition_evidence:
  x_api_sweep: evidence/competition/X-OFFICIAL-THREAD-SWEEP-2026-09-08.md
  posts_captured: 395
  track_a_explicit_or_likely_rows_before_dedupe: 119
  latest_winner_intelligence: product/WINNER-INTELLIGENCE-RERUN-004-X-API.md
  key_correction: >-
    Do not claim temporal drift/proposal expiry is globally unique. RiskPilot and Trade Preflight
    contain temporal/freshness controls. Valid Until must win on action-decision contract centrality.

lifecycle_effect:
  previous_trace_6_5: PASS_BEFORE_LIVE_TESTNET_SCOPE_CHANGE
  previous_trace_6_75: PAUSED
  reason: material live-proof scope change after previous TRACE state
  required_sequence:
    - human_installs_testnet_environment_secrets
    - pbpd_adds_manual_testnet_workflow_and_sanitizer
    - real_testnet_capture
    - pbpd_claim_and_prd_reconciliation
    - deploy_judge_delta
    - trace_delta_assurance
    - winning_intelligence_final_recheck
    - trace_6_75_refreshed_video
    - pbpd_candidate_handoff
    - project_finisher
    - human_protected_submission

next_action_for_human:
  - create GitHub Environment named testnet-proof if it does not exist
  - add BINANCE_TESTNET_API_KEY as an Environment secret
  - add BINANCE_TESTNET_API_SECRET as an Environment secret
  - do not paste either value into chat
  - confirm only that both secrets are present

next_handoff_after_human_secret_confirmation:
  from: HUMAN_SECRET_BOUNDARY
  to: PBPD
  required_output: >-
    Add manual live-testnet-proof GitHub Actions workflow, create ephemeral binance-cli testnet profile,
    execute bounded Valid Until Spot Testnet proof, sanitize the result, and expose only safe evidence to Vercel.

resume_rule: >-
  A new conversation must read state/CURRENT.yaml and state/HANDOVER.yaml first. Do not return to video recording,
  Project Finisher or protected submission. First confirm the GitHub testnet-proof Environment contains both required
  secrets without exposing their values. Then PBPD owns the manual Actions workflow and authenticated Spot Testnet capture.
  Preserve BLOCK honestly; if ALLOW occurs, retain only sanitized order/verification evidence. Mainnet remains forbidden.
