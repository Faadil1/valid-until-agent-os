product_contract:
  thesis: >-
    Freeze user execution constraints before reading the market, bind a decision to the exact Binance state
    that justified it, and require deterministic pre-action revalidation so stale reasoning cannot become
    a consequential action.
  human_role: define/accept policy and retain protected external authority
  agent_role: interpret intent and propose action; never self-authorize execution
  agent_os_role: supply fresh Binance observations and capabilities to the agent workflow
  valid_until_role: deterministically authorize whether the exact proposed action is still valid
  execution_adapter: intentionally_not_implemented
  terminal_states: [ALLOW, BLOCK]

