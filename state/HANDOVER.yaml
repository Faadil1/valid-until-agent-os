next_action_for_human:
  - create/select Binance CLI testnet profile locally
  - never paste the key/secret into chat
  - run the bounded live:testnet command with explicit confirmation variable
  - return only sanitized output/result if help interpreting is needed

resume_rule: >-
  Do not return to final video recording yet. First obtain or fail-close the real authenticated Spot Testnet capture.
  If the run returns BLOCK, preserve it honestly and start a fresh decision cycle. If it returns ALLOW, capture the
  sanitized testnet order response and verification response. Mainnet execution remains outside this Track A proof.
